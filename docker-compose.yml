services:
  api:
    build:
      context: .
      target: runtime
    image: dataextractor:latest
    ports:
      - "8000:8000"
    command:
      - python
      - api_server.py
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --app-config
      - config/app_config.yml
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./config:/app/config
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  api-ocr:
    profiles:
      - ocr
    build:
      context: .
      target: ocr
    image: dataextractor:ocr
    ports:
      - "8001:8000"
    command:
      - python
      - api_server.py
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --app-config
      - config/app_config.yml
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./config:/app/config
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
