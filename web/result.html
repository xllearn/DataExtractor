<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DataExtractor 结果</title>
    <link rel="stylesheet" href="/web/style.css" />
  </head>
  <body>
    <main class="app-shell result-shell">
      <header class="app-header">
        <div class="app-title">
          <h1>抽取结果</h1>
          <p id="jobIdText">job_id: --</p>
        </div>
        <button id="backBtn" type="button">返回列表</button>
      </header>

      <section class="result-summary">
        <div class="result-state">
          <span id="statusText" class="result-badge">读取任务状态...</span>
          <span id="previewMeta" class="metric-chip">结果数据 · 等待生成</span>
          <span id="previewStatusText" class="metric-chip">预览等待中</span>
        </div>
        <span id="riskText" class="warning"></span>
        <div class="job-actions result-actions">
          <a id="downloadBtn" class="action-link" href="#" hidden>下载 Excel</a>
          <button id="cancelBtn" type="button" disabled>取消</button>
        </div>
      </section>

      <section class="current-job-panel">
        <header class="panel-header">
          <div>
            <h2>任务进度</h2>
            <p id="currentTitleText">当前文章：--</p>
          </div>
        </header>
        <div class="job-metrics">
          <span id="jobProgressText" class="metric-chip">0 / 0</span>
        </div>
        <progress id="jobProgressBar" class="job-progress" max="100" value="0"></progress>
      </section>

      <section class="workbench-grid result-workbench" aria-label="任务详情">
        <section class="workbench-panel log-panel">
          <h2>实时日志</h2>
          <pre id="jobLogTail" class="job-log-tail">暂无日志</pre>
        </section>
        <section class="workbench-panel summary-panel" id="jobSummaryPanel">
          <h2>Summary</h2>
          <p>暂无 summary</p>
        </section>
      </section>

      <section class="preview">
        <div class="table-scroll">
          <table class="preview-table">
            <thead id="previewHead"></thead>
            <tbody id="previewBody"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="/web/result.js?v=0.3.0-productized"></script>
  </body>
</html>
