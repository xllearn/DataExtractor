<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DataExtractor</title>
    <link rel="stylesheet" href="/web/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="app-title">
          <h1>DataExtractor</h1>
          <p>政策文章结构化抽取工作台</p>
        </div>
        <button id="refreshBtn" type="button">刷新</button>
      </header>

      <section class="status-grid" aria-label="运行状态">
        <span id="databaseChip" class="status-chip status-chip-pending">
          <span class="status-dot"></span>
          <strong>数据库</strong>
          <span id="databaseStatusText">读取中</span>
        </span>
        <span id="llmChip" class="status-chip status-chip-pending">
          <span class="status-dot"></span>
          <strong>LLM</strong>
          <span id="llmStatusText">读取中</span>
        </span>
        <span id="ocrChip" class="status-chip status-chip-pending">
          <span class="status-dot"></span>
          <strong>OCR</strong>
          <span id="ocrStatusText">读取中</span>
        </span>
        <span class="status-chip status-chip-muted">
          <strong>服务</strong>
          <span id="configStatus">正在读取状态...</span>
        </span>
        <span class="status-chip status-chip-muted">
          <strong>前端</strong>
          <span id="versionStatusText">--</span>
        </span>
      </section>

      <section class="command-panel">
        <div class="controls">
          <input id="keywordInput" type="search" placeholder="关键词" />
          <button id="searchBtn" type="button">搜索</button>
          <button id="extractBtn" type="button">生成 Excel</button>
        </div>

        <div class="extract-settings" aria-label="抽取设置">
          <fieldset class="segmented-control">
            <legend>抽取模式</legend>
            <label>
              <input id="modeMergeInput" type="radio" name="extractMode" value="merge" checked />
              合并
            </label>
            <label>
              <input id="modeSingleInput" type="radio" name="extractMode" value="single" />
              单文件
            </label>
          </fieldset>

          <label class="switch-row"><input id="noOcrInput" type="checkbox" checked /> 跳过 OCR</label>
          <label class="switch-row"><input id="noLlmInput" type="checkbox" /> 跳过 LLM</label>
          <label class="field-row">
            <span>Prompt</span>
            <select id="promptVersionInput">
              <option value="v3" selected>v3</option>
              <option value="v2">v2</option>
            </select>
          </label>
        </div>

        <div class="upload-panel" aria-label="Excel 上传抽取">
          <label class="file-input-row" for="uploadXlsxInput">
            <span>上传 Excel</span>
            <input id="uploadXlsxInput" type="file" accept=".xlsx" />
          </label>
          <div class="upload-actions">
            <button id="uploadExtractBtn" type="button" disabled>上传并抽取</button>
            <span id="uploadStatusText" class="summary-hint">仅支持 .xlsx</span>
          </div>
        </div>

        <details class="ocr-panel">
          <summary>
            <span>外部 OCR 文本</span>
            <span class="summary-hint">可选：粘贴图片表格 OCR 文本作为识别兜底</span>
          </summary>
          <textarea id="externalOcrInput" rows="4" placeholder="粘贴图片表格 OCR 文本"></textarea>
        </details>
      </section>

      <section class="selection-panel">
        <div class="selection-copy">
          <span id="selectionStatus" class="metric-chip">已选择 0 条</span>
          <span id="jobStatus"></span>
          <span id="ocrWarning" class="warning"></span>
        </div>
        <button id="clearSelectionBtn" type="button">清空已选择</button>
      </section>

      <section class="workbench-grid" aria-label="任务工作台">
        <section id="currentJobPanel" class="current-job-panel workbench-panel">
          <header class="panel-header">
            <div>
              <h2>当前任务</h2>
              <p id="currentJobIdText">未创建任务</p>
            </div>
            <button id="jobRefreshBtn" type="button">刷新任务</button>
          </header>

          <div class="job-metrics">
            <span id="currentJobStatusText" class="result-badge">空闲</span>
            <span id="jobProgressText" class="metric-chip">0 / 0</span>
            <span id="currentTitleText" class="metric-chip">当前文章：--</span>
          </div>

          <progress id="jobProgressBar" class="job-progress" max="100" value="0"></progress>

          <div class="job-actions">
            <a id="jobDownloadLink" class="action-link" href="#" hidden>下载</a>
            <a id="jobPreviewLink" class="action-link action-link-secondary" href="#" hidden>结果页</a>
            <button id="jobSummaryBtn" type="button" disabled>读取 summary</button>
            <button id="jobCancelBtn" type="button" disabled>取消</button>
          </div>

          <div class="job-panel-grid">
            <section class="log-panel">
              <h3>实时日志</h3>
              <pre id="jobLogTail" class="job-log-tail">暂无日志</pre>
            </section>
            <section class="summary-panel" id="jobSummaryPanel">
              <h3>Summary</h3>
              <p>暂无 summary</p>
            </section>
          </div>
        </section>

        <section class="job-history workbench-panel">
          <header class="panel-header">
            <div>
              <h2>历史任务</h2>
              <p>最近 20 个任务</p>
            </div>
            <button id="historyRefreshBtn" type="button">刷新历史</button>
          </header>
          <div class="history-scroll">
            <table class="history-table">
              <thead>
                <tr>
                  <th>任务</th>
                  <th>状态</th>
                  <th>进度</th>
                  <th>更新时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="jobHistoryBody"></tbody>
            </table>
          </div>
        </section>
      </section>

      <section class="pagination-bar" aria-label="分页">
        <button id="prevPageBtn" type="button">上一页</button>
        <span id="pageStatus">第 0 / 0 页</span>
        <button id="nextPageBtn" type="button">下一页</button>
        <label>
          每页
          <select id="pageSizeSelect">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
          </select>
        </label>
        <span id="totalStatus">总计 0 条</span>
      </section>

      <section class="table-card">
        <table class="article-table">
          <thead>
            <tr>
              <th class="checkbox-column"><input id="selectPageInput" type="checkbox" /></th>
              <th>标题</th>
              <th>地区</th>
              <th>保险类型</th>
              <th>审核时间</th>
              <th>来源</th>
            </tr>
          </thead>
          <tbody id="articleBody"></tbody>
        </table>
      </section>
    </main>
    <script src="/web/app.js?v=0.3.0-productized"></script>
  </body>
</html>
